name: Rapor oluştur

on:
  # Yalnızca elle çalışır: Actions sekmesindeki "Run workflow" düğmesi.
  workflow_dispatch:

permissions:
  contents: write # rapor.md'yi repoya kaydetmek için

concurrency:
  group: rapor-olustur
  cancel-in-progress: false

jobs:
  rapor:
    runs-on: ubuntu-latest
    env:
      # Ajan "bugün"ü yerel saate göre hesaplar; Türkiye tarihini kullansın.
      TZ: Europe/Istanbul
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ajanı çalıştır
        run: python agent.py

      - name: rapor.md değiştiyse kaydet
        run: |
          if git diff --quiet -- rapor.md; then
            echo "Rapor değişmedi, commit atlanıyor."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rapor.md
          git commit -m "Rapor: $(date +%d.%m.%Y)"
          git push
